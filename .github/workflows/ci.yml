name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Offline sync engine (fake IndexedDB + fake Supabase).
      - name: Unit tests
        run: npm test

      # Applies every migration to an in-memory Postgres and runs the pgTAP
      # tests (security policies, payout engine). See scripts/test-db-local.mjs.
      - name: Database tests
        run: npm run test:db

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

      # Informational until the existing lint backlog is cleared (Phase 8).
      - name: Lint
        run: npx eslint src
        continue-on-error: true
